<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create custom test - Test Series</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0d">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .custom-card { padding: 1.5rem; display: grid; gap: 1rem; }
    .custom-card h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.02em; }
    .field { display: grid; gap: 0.45rem; }
    .field > span { color: var(--muted); font-size: 0.82rem; font-weight: 600; }
    .field select, .field input[type="number"], .field input[type="text"] {
      min-height: 44px; padding: 0.55rem 0.8rem; border-radius: 14px;
      border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .chip.toggleable { user-select: none; }
    .chip.toggleable.active { background: var(--surface-3); color: var(--text); border-color: var(--accent-line); }
    .chip .count { opacity: 0.6; font-weight: 500; margin-left: 0.35rem; }
    .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
    .status { color: var(--muted); font-size: 0.85rem; }
    .status.error { color: var(--danger-text); }
    .recent-list { display: grid; gap: 0.5rem; }
    .recent-list a { color: var(--accent-2); text-decoration: none; font-size: 0.88rem; }
    .recent-list a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="layout">
    <section class="card custom-card">
      <a class="ghost-btn ghost-btn-sm" href="index.html">&larr; Library</a>
      <h1>Create custom test</h1>
      <p class="subtitle">Pick a branch and any subjects. A fresh paper is built instantly from random questions of the matching local papers.</p>

      <label class="field">
        <span>Branch</span>
        <select id="branch"></select>
      </label>

      <div class="field">
        <span>Subjects</span>
        <div id="subjects" class="chips"></div>
      </div>

      <div class="row">
        <label class="field">
          <span>Questions</span>
          <input id="count" type="number" min="1" max="100" value="30">
        </label>
        <label class="field" style="flex:1">
          <span>Test name (optional)</span>
          <input id="name" type="text" placeholder="e.g. Evening revision">
        </label>
      </div>

      <div class="row">
        <button id="generate" class="primary-btn" type="button">Generate test</button>
        <span id="status" class="status" role="status" aria-live="polite"></span>
      </div>

      <div class="field">
        <span>Your custom tests</span>
        <div id="recent" class="recent-list"></div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const branchSel = document.getElementById("branch");
      const subjectsEl = document.getElementById("subjects");
      const countEl = document.getElementById("count");
      const nameEl = document.getElementById("name");
      const generateBtn = document.getElementById("generate");
      const statusEl = document.getElementById("status");
      const recentEl = document.getElementById("recent");
      let subjects = [];

      const setStatus = (text, isError) => {
        statusEl.textContent = text;
        statusEl.classList.toggle("error", Boolean(isError));
      };

      async function loadRecent() {
        recentEl.replaceChildren();
        try {
          const response = await fetch("custom/list");
          const data = await response.json();
          for (const entry of (data.tests || []).slice().reverse()) {
            const link = document.createElement("a");
            link.href = `paper.html?path=${encodeURIComponent(entry.path)}`;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = `${entry.name} — ${entry.branch} (${entry.questions} questions)`;
            recentEl.appendChild(link);
          }
          if (!(data.tests || []).length) {
            recentEl.textContent = "No custom tests yet.";
          }
        } catch (error) {
          recentEl.textContent = "Custom tests are generated by the local app only.";
        }
      }

      async function loadSubjects() {
        subjectsEl.replaceChildren();
        const branch = branchSel.value;
        if (!branch) return;
        setStatus("Loading subjects…");
        try {
          const response = await fetch(`custom/meta?branch=${encodeURIComponent(branch)}`);
          const meta = await response.json();
          subjects = meta.subjects || [];
          for (const subject of subjects) {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "chip toggleable";
            chip.setAttribute("aria-pressed", "false");
            const label = document.createElement("span");
            label.textContent = subject.name;
            const count = document.createElement("span");
            count.className = "count";
            count.textContent = String(subject.questions);
            chip.append(label, count);
            chip.addEventListener("click", () => {
              const active = chip.classList.toggle("active");
              chip.setAttribute("aria-pressed", String(active));
            });
            subjectsEl.appendChild(chip);
          }
          setStatus(subjects.length ? "" : "No subjects found for this branch.");
        } catch (error) {
          setStatus("Could not load subjects.", true);
        }
      }

      async function init() {
        try {
          const response = await fetch("custom/meta");
          const meta = await response.json();
          for (const branch of meta.branches || []) {
            const option = document.createElement("option");
            option.value = branch.name;
            option.textContent = `${branch.name} (${branch.testCount} papers)`;
            branchSel.appendChild(option);
          }
        } catch (error) {
          setStatus("Could not load subjects.", true);
        }
        await loadSubjects();
        await loadRecent();
      }

      branchSel.addEventListener("change", loadSubjects);

      generateBtn.addEventListener("click", async () => {
        const selected = Array.from(subjectsEl.querySelectorAll(".chip.active"))
          .map((chip) => chip.firstChild.textContent.trim());
        if (!branchSel.value) return setStatus("Pick a branch first.", true);
        if (!selected.length) return setStatus("Pick at least one subject.", true);
        generateBtn.disabled = true;
        setStatus(`Building your ${countEl.value}-question test…`);
        try {
          const response = await fetch("custom/generate", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              branch: branchSel.value,
              subjects: selected,
              count: Number(countEl.value) || 30,
              name: nameEl.value
            })
          });
          const result = await response.json();
          if (!response.ok || result.ok === false) throw new Error(result.error || "Generation failed");
          const { entry } = result;
          setStatus(`Ready: ${entry.questions} questions, about ${Math.round(entry.durationSec / 60)} minutes.`);
          if (entry.dataUrl) {
            window.open(entry.dataUrl, "_blank", "noopener");
            try {
              const list = JSON.parse(localStorage.getItem("custom-tests-local-v1") || "[]");
              list.push({ name: entry.name, branch: entry.branch, questions: entry.questions, href: entry.dataUrl });
              if (list.length > 20) list.splice(0, list.length - 20);
              localStorage.setItem("custom-tests-local-v1", JSON.stringify(list));
            } catch (_) {}
          } else {
            window.open(`paper.html?path=${encodeURIComponent(entry.path)}`, "_blank", "noopener");
          }
          await loadRecent();
        } catch (error) {
          setStatus(error.message || "Generation failed.", true);
        }
        generateBtn.disabled = false;
      });

      init();
    })();
  </script>
</body>
</html>
